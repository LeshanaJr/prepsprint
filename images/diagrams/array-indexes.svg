<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">Array indexes and initial values</title><desc id="desc">A Java int array a contains 2,4,6,8,10 at indexes 0,1,2,3,4. Its length is 5.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:24px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#475569}.bold{font-size:19px;font-weight:700}.axis{stroke:#334155;stroke-width:2;fill:none}.grid{stroke:#dbe4ee;stroke-width:1}.plot{stroke:#4338ca;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.secondary{stroke:#087f8c;stroke-width:4;fill:none;stroke-dasharray:9 6}.tick{font-size:16px;fill:#475569}</style>
<rect width="800" height="480" rx="16" fill="#ffffff"/>
<text x="40" y="43" class="title" text-anchor="start">Array indexes and initial values</text><text x="400" y="104" class="bold" text-anchor="middle">int[] a = {2, 4, 6, 8, 10};</text><text x="75" y="174" class="small" text-anchor="start">Index</text><text x="75" y="251" class="small" text-anchor="start">Value</text><text x="204" y="173" class="bold" text-anchor="middle">0</text><rect x="155" y="195" width="98" height="92" rx="8" fill="#e0e7ff"/><text x="204" y="251" class="title" text-anchor="middle">2</text><text x="314" y="173" class="bold" text-anchor="middle">1</text><rect x="265" y="195" width="98" height="92" rx="8" fill="#ccfbf1"/><text x="314" y="251" class="title" text-anchor="middle">4</text><text x="424" y="173" class="bold" text-anchor="middle">2</text><rect x="375" y="195" width="98" height="92" rx="8" fill="#e0e7ff"/><text x="424" y="251" class="title" text-anchor="middle">6</text><text x="534" y="173" class="bold" text-anchor="middle">3</text><rect x="485" y="195" width="98" height="92" rx="8" fill="#ccfbf1"/><text x="534" y="251" class="title" text-anchor="middle">8</text><text x="644" y="173" class="bold" text-anchor="middle">4</text><rect x="595" y="195" width="98" height="92" rx="8" fill="#e0e7ff"/><text x="644" y="251" class="title" text-anchor="middle">10</text><text x="400" y="347" class="label" text-anchor="middle">a.length = 5 · valid indexes: 0 through 4</text><text x="400" y="390" class="small" text-anchor="middle">These are the initial values before any loop executes.</text>
<text x="760" y="464" class="small" text-anchor="end">PrepSprint · Original educational illustration</text>
</svg>
