<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">Energy flow through a food chain</title><desc id="desc">Grass 10,000 J to grasshoppers 1,000 J to frogs 100 J to snakes 10 J; 10 percent transfer at each step.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:24px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#475569}.bold{font-size:19px;font-weight:700}.axis{stroke:#334155;stroke-width:2;fill:none}.grid{stroke:#dbe4ee;stroke-width:1}.plot{stroke:#4338ca;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.secondary{stroke:#087f8c;stroke-width:4;fill:none;stroke-dasharray:9 6}.tick{font-size:16px;fill:#475569}</style>
<rect width="800" height="480" rx="16" fill="#ffffff"/>
<text x="40" y="43" class="title" text-anchor="start">Energy flow through a food chain</text><text x="400" y="90" class="small" text-anchor="middle">Energy transferred into biomass over the same area and time</text><rect x="38" y="155" width="155" height="180" rx="8" fill="#e0e7ff"/><text x="115.5" y="191" class="bold" text-anchor="middle">Producers</text><text x="115.5" y="226" class="small" text-anchor="middle">Grass</text><text x="115.5" y="286" class="bold" text-anchor="middle">10,000 J</text><line x1="198" y1="244" x2="224" y2="244" class="axis" marker-end="url(#arrow)"/><text x="213" y="220" class="small" text-anchor="middle">10%</text><rect x="228" y="155" width="155" height="180" rx="8" fill="#ccfbf1"/><text x="305.5" y="191" class="bold" text-anchor="middle">Primary</text><text x="305.5" y="226" class="small" text-anchor="middle">Grasshoppers</text><text x="305.5" y="286" class="bold" text-anchor="middle">1,000 J</text><line x1="388" y1="244" x2="414" y2="244" class="axis" marker-end="url(#arrow)"/><text x="403" y="220" class="small" text-anchor="middle">10%</text><rect x="418" y="155" width="155" height="180" rx="8" fill="#e0e7ff"/><text x="495.5" y="191" class="bold" text-anchor="middle">Secondary</text><text x="495.5" y="226" class="small" text-anchor="middle">Frogs</text><text x="495.5" y="286" class="bold" text-anchor="middle">100 J</text><line x1="578" y1="244" x2="604" y2="244" class="axis" marker-end="url(#arrow)"/><text x="593" y="220" class="small" text-anchor="middle">10%</text><rect x="608" y="155" width="155" height="180" rx="8" fill="#ccfbf1"/><text x="685.5" y="191" class="bold" text-anchor="middle">Tertiary</text><text x="685.5" y="226" class="small" text-anchor="middle">Snakes</text><text x="685.5" y="286" class="bold" text-anchor="middle">10 J</text><text x="400" y="394" class="label" text-anchor="middle">Arrows point from food to consumer.</text><text x="400" y="422" class="small" text-anchor="middle">A simplified 10% transfer model; actual efficiencies vary.</text>
<text x="760" y="464" class="small" text-anchor="end">PrepSprint · Original educational illustration</text>
</svg>
