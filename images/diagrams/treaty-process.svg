<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">Shared power in making a treaty</title><desc id="desc">President negotiates and submits; Senate advice and consent requires two-thirds of senators present; President may then ratify.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:24px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#475569}.bold{font-size:19px;font-weight:700}.axis{stroke:#334155;stroke-width:2;fill:none}.grid{stroke:#dbe4ee;stroke-width:1}.plot{stroke:#4338ca;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.secondary{stroke:#087f8c;stroke-width:4;fill:none;stroke-dasharray:9 6}.tick{font-size:16px;fill:#475569}</style>
<rect width="800" height="480" rx="16" fill="#ffffff"/>
<text x="40" y="43" class="title" text-anchor="start">Shared power in making a treaty</text><text x="400" y="90" class="small" text-anchor="middle">Article II treaty process · simplified</text><rect x="30" y="170" width="220" height="155" rx="8" fill="#e0e7ff"/><text x="140" y="209" class="bold" text-anchor="middle">1. President</text><text x="140" y="253" class="label" text-anchor="middle">Negotiates and</text><text x="140" y="283" class="small" text-anchor="middle">submits a treaty</text><line x1="255" y1="245" x2="285" y2="245" class="axis" marker-end="url(#arrow)"/><rect x="293" y="170" width="220" height="155" rx="8" fill="#ccfbf1"/><text x="403" y="209" class="bold" text-anchor="middle">2. Senate</text><text x="403" y="253" class="label" text-anchor="middle">Advice and consent:</text><text x="403" y="283" class="small" text-anchor="middle">⅔ of senators present</text><line x1="518" y1="245" x2="548" y2="245" class="axis" marker-end="url(#arrow)"/><rect x="556" y="170" width="220" height="155" rx="8" fill="#e0e7ff"/><text x="666" y="209" class="bold" text-anchor="middle">3. President</text><text x="666" y="253" class="label" text-anchor="middle">May ratify after</text><text x="666" y="283" class="small" text-anchor="middle">Senate consent</text><text x="400" y="385" class="small" text-anchor="middle">Senate consent permits ratification; it does not itself ratify.</text><text x="400" y="415" class="small" text-anchor="middle">Source: U.S. Senate · About Treaties</text>
<text x="760" y="464" class="small" text-anchor="end">PrepSprint · Original educational illustration</text>
</svg>
