<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">A network with alternative paths</title><desc id="desc">Working links A-B, A-C, B-C, C-D. B-D has failed. All links are bidirectional.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:24px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#475569}.bold{font-size:19px;font-weight:700}.axis{stroke:#334155;stroke-width:2;fill:none}.grid{stroke:#dbe4ee;stroke-width:1}.plot{stroke:#4338ca;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.secondary{stroke:#087f8c;stroke-width:4;fill:none;stroke-dasharray:9 6}.tick{font-size:16px;fill:#475569}</style>
<rect width="800" height="480" rx="16" fill="#ffffff"/>
<text x="40" y="43" class="title" text-anchor="start">A network with alternative paths</text><text x="400" y="85" class="small" text-anchor="middle">Connections work in both directions</text><line x1="145" y1="250" x2="390" y2="130" class="axis" /><line x1="145" y1="250" x2="390" y2="370" class="axis" /><line x1="390" y1="130" x2="390" y2="370" class="axis" /><line x1="390" y1="130" x2="645" y2="250" class="axis" stroke-dasharray="8 6"/><line x1="390" y1="370" x2="645" y2="250" class="axis" /><path d="M500,161 L534,195 M534,161 L500,195" stroke="#b91c1c" stroke-width="5"/><text x="570" y="154" class="small" text-anchor="middle">Failed link</text><circle cx="145" cy="250" r="34" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="145" y="257" class="bold" text-anchor="middle">A</text><circle cx="390" cy="130" r="34" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="390" y="137" class="bold" text-anchor="middle">B</text><circle cx="390" cy="370" r="34" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="390" y="377" class="bold" text-anchor="middle">C</text><circle cx="645" cy="250" r="34" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="645" y="257" class="bold" text-anchor="middle">D</text><text x="400" y="439" class="small" text-anchor="middle">A packet can route around the failed B–D connection.</text>
<text x="760" y="464" class="small" text-anchor="end">PrepSprint · Original educational illustration</text>
</svg>
